<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{ style.fonts.google_url }}" rel="stylesheet">
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --primary: {{ style.colors.accent_primary|default('#C41E3A') }};
            --gold: {{ style.colors.accent_secondary|default('#D4AF37') }};
            --indigo: {{ style.colors.accent_highlight|default('#1E3A5F') }};
            --ink: #1A1A1A;
            --text-sub: #555555;
            --bg: {{ style.colors.bg_primary|default('#F5F5F0') }};
            --bg-alt: {{ style.colors.bg_secondary|default('#EDEDE6') }};
            --text: {{ style.colors.text_primary|default('#1A1A1A') }};
            --font-d: '{{ style.fonts.display|default('Noto Serif SC') }}', serif;
            --font-b: '{{ style.fonts.body|default('Noto Sans SC') }}', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: var(--font-b); color: var(--text);
            background: var(--bg); -webkit-font-smoothing: antialiased;
        }

        /* ===== 宣纸纹理背景 ===== */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(196,30,58,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(212,175,55,0.03) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        /* ===== 幻灯片系统 ===== */
        .slides-container { width: 100%; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
            will-change: transform;
        }

        /* ===== Reveal 动画 ===== */
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .slide.active .reveal { opacity: 1; transform: translateY(0); }
        .slide.active .reveal:nth-child(1) { transition-delay: 0.08s; }
        .slide.active .reveal:nth-child(2) { transition-delay: 0.16s; }
        .slide.active .reveal:nth-child(3) { transition-delay: 0.24s; }
        .slide.active .reveal:nth-child(4) { transition-delay: 0.32s; }
        .slide.active .reveal:nth-child(5) { transition-delay: 0.40s; }
        .slide.active .reveal:nth-child(6) { transition-delay: 0.48s; }

        /* ===== 进度条 ===== */
        .progress-bar {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--gold));
            transition: width 0.4s ease; z-index: 100;
        }

        /* ===== 导航点 ===== */
        .nav-dots {
            position: fixed; right: clamp(1rem, 2vw, 2rem); top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .nav-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--text-sub); opacity: 0.25; cursor: pointer;
            transition: all 0.3s ease; border: none; padding: 0;
        }
        .nav-dot.active {
            opacity: 1; background: var(--primary);
            transform: scale(1.3); box-shadow: 0 0 8px rgba(196,30,58,0.3);
        }
        .nav-dot:hover { opacity: 0.6; transform: scale(1.2); }

        /* ===== 页码 ===== */
        .page-indicator {
            position: fixed; bottom: clamp(1rem, 2vw, 2rem); right: clamp(1rem, 2vw, 2rem);
            font-size: 0.8rem; color: var(--text-sub); opacity: 0.5; z-index: 100;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 金色粒子画布 ===== */
        #particleCanvas {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
        }

        /* ===== 共有装饰：顶部金色线 ===== */
        .slide::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 2px; background: var(--gold); z-index: 10;
        }

        /* ===== 共有装饰：底部红色线 ===== */
        .slide::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 1px; background: var(--primary); z-index: 10;
        }

        /* ===== 角落回纹装饰 ===== */
        .corner-huiwen {
            position: absolute; width: 28px; height: 28px; z-index: 5; pointer-events: none;
        }
        .corner-huiwen::before, .corner-huiwen::after {
            content: ''; position: absolute;
            background: var(--gold); opacity: 0.5;
        }
        /* 左上角 */
        .corner-huiwen.tl { top: 12px; left: 12px; }
        .corner-huiwen.tl::before { top: 0; left: 0; width: 28px; height: 2px; }
        .corner-huiwen.tl::after { top: 0; left: 0; width: 2px; height: 28px; }
        .corner-huiwen.tl .huiwen-inner::before { top: 6px; left: 6px; width: 16px; height: 2px; }
        .corner-huiwen.tl .huiwen-inner::after { top: 6px; left: 6px; width: 2px; height: 16px; }
        /* 右上角 */
        .corner-huiwen.tr { top: 12px; right: 12px; }
        .corner-huiwen.tr::before { top: 0; right: 0; width: 28px; height: 2px; }
        .corner-huiwen.tr::after { top: 0; right: 0; width: 2px; height: 28px; }
        /* 左下角 */
        .corner-huiwen.bl { bottom: 12px; left: 12px; }
        .corner-huiwen.bl::before { bottom: 0; left: 0; width: 28px; height: 2px; }
        .corner-huiwen.bl::after { bottom: 0; left: 0; width: 2px; height: 28px; }
        /* 右下角 */
        .corner-huiwen.br { bottom: 12px; right: 12px; }
        .corner-huiwen.br::before { bottom: 0; right: 0; width: 28px; height: 2px; }
        .corner-huiwen.br::after { bottom: 0; right: 0; width: 2px; height: 28px; }

        /* 回纹内层 */
        .huiwen-inner { position: absolute; inset: 0; }
        .huiwen-inner::before, .huiwen-inner::after {
            content: ''; position: absolute;
            background: var(--gold); opacity: 0.35;
        }

        /* ===========================
           1. 封面页 (slide-cover)
           =========================== */
        .slide-cover {
            background: transparent;
            color: #1A1A1A; text-align: center; overflow: hidden;
            position: relative;
        }
        /* 封面页覆盖共有线条 */
        .slide-cover::before { display: none; }
        .slide-cover::after { display: none; }

        }

        /* 祥云 SVG 装饰 - 左上角 */
        .cover-cloud {
            position: absolute; top: 30px; left: 30px; z-index: 2;
            opacity: 0.15;
        }
        .cover-cloud svg { width: clamp(100px, 15vw, 180px); height: auto; }

        /* 封面内容层 */
        .cover-content-layer {
            position: relative; z-index: 3; max-width: 700px;
            padding: 0 clamp(2rem, 5vw, 4rem);
        }
        .cover-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: 64px; line-height: 1.3;
            letter-spacing: 4px; margin-bottom: 0px;
            color: #1A1A1A;
        }
        .cover-divider {
            display: flex; align-items: center; justify-content: center; gap: 12px; margin: 64px 0;
        }
        .cover-divider-line {
            width: 50px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        .cover-divider-diamond {
            width: 10px; height: 10px; background: var(--primary);
            transform: rotate(45deg);
        }
        .cover-subtitle {
            font-family: var(--font-b); font-weight: 400;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            color: #555555; line-height: 1.6; letter-spacing: 2px;
        }
        .cover-date-area {
            margin-top: 48px; font-size: clamp(0.8rem, 1.2vw, 0.95rem);
            color: #888888; letter-spacing: 1px;
        }

        /* ===========================
           2. 目录页 (slide-toc)
           =========================== */
        .slide-toc {
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        .toc-container {
            position: relative; z-index: 2; width: 100%; max-width: 700px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .toc-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            text-align: center; margin-bottom: clamp(20px, 3vh, 40px);
            color: var(--text);
        }

        .toc-list {
            list-style: none; width: 100%;
            display: flex; flex-direction: column; gap: clamp(10px, 1.5vh, 18px);
        }

        .toc-item {
            display: flex; align-items: center; gap: clamp(12px, 1.5vw, 20px);
            padding: clamp(12px, 1.5vh, 20px) clamp(16px, 2vw, 28px);
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(212,175,55,0.15);
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }
        .toc-item:hover {
            transform: translateX(8px);
            border-color: var(--gold);
            box-shadow: 0 2px 12px rgba(212,175,55,0.15);
        }

        .toc-item-num {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1rem, 1.5vw, 1.3rem);
            color: var(--primary); flex-shrink: 0;
            min-width: 2em;
        }

        .toc-item-text {
            font-size: clamp(0.9rem, 1.3vw, 1.1rem);
            color: var(--text); line-height: 1.5;
        }

        /* 底部回纹装饰条 */
        .toc-huiwen-bar {
            margin-top: clamp(20px, 3vh, 36px);
            display: flex; align-items: center; justify-content: center; gap: 0;
            width: 100%; max-width: 400px;
        }
        .toc-huiwen-bar .hw-seg {
            flex: 1; height: 2px; background: var(--gold); opacity: 0.4;
        }
        .toc-huiwen-bar .hw-corner {
            width: 10px; height: 10px; border: 2px solid var(--gold); opacity: 0.4;
        }
        .toc-huiwen-bar .hw-corner.left { border-right: none; border-bottom: none; }
        .toc-huiwen-bar .hw-corner.right { border-left: none; border-top: none; }

        /* ===========================
           3. 内容页 (slide-content)
           =========================== */
        .slide-content-page {
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* 中式内容区 */
        .zh-content {
            position: relative; z-index: 2; width: 100%; max-width: 1100px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        /* 标题区 */
        .zh-header { display: flex; align-items: center; gap: 12px; margin-bottom: 64px; align-self: flex-start; }
        .zh-header-bar { width: 4px; height: 24px; background: var(--primary); border-radius: 2px; flex-shrink: 0; }
        .zh-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 2.4rem); color: var(--text); line-height: 1.3;
        }
        .zh-title-center { text-align: center; align-self: center; }
        .zh-subtitle {
            font-size: 20px; color: var(--text-sub);
            margin-bottom: 40px; align-self: flex-start; line-height: 1.6;
        }
        .zh-subtitle-center { text-align: center; align-self: center; }

        /* 顶部/底部装饰线 */
        .zh-top-line { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent 50%, var(--gold)); z-index: 3; }
        .zh-bottom-line { position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary), transparent); z-index: 3; }

        /* 角落回纹 */
        .corner-huiwen { position: absolute; z-index: 1; pointer-events: none; }
        .corner-tl { top: 12px; left: 12px; width: 20px; height: 20px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); opacity: 0.3; }
        .corner-tr { top: 12px; right: 12px; width: 20px; height: 20px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); opacity: 0.3; }
        .corner-bl { bottom: 12px; left: 12px; width: 20px; height: 20px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); opacity: 0.3; }
        .corner-br { bottom: 12px; right: 12px; width: 20px; height: 20px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); opacity: 0.3; }

        /* ===== 要点卡片 ===== */
        .zh-cards-grid { display: grid; gap: clamp(12px, 1.5vw, 20px); width: 100%; grid-template-columns: repeat(3, 1fr); }
        .zh-cards-grid.cols-1 { grid-template-columns: 1fr; }
        .zh-cards-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .zh-cards-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
        .zh-cards-grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
        .zh-cards-grid.cols-5 { grid-template-columns: repeat(3, 1fr); }
        .zh-cards-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
        .zh-cards-vertical { display: flex; flex-direction: column; gap: clamp(12px, 1.5vh, 18px); width: 100%; }

        .zh-card {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(212,175,55,0.2);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: clamp(16px, 2vw, 24px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex; gap: clamp(12px, 1.5vw, 18px); align-items: flex-start;
        }
        .zh-card:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(212,175,55,0.15);
        }
        .zh-card-bar { display: none; }
        .zh-card-icon {
            width: clamp(40px, 4vw, 52px); height: clamp(40px, 4vw, 52px);
            border-radius: 10px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary), #e8304a);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(196,30,58,0.2);
        }
        .zh-card-icon svg { width: 55%; height: 55%; stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .zh-card-body { flex: 1; min-width: 0; }
        .zh-card-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(0.9rem, 1.3vw, 1.05rem); color: var(--text);
            margin-bottom: 6px;
        }
        .zh-card-text {
            font-size: clamp(0.78rem, 1.1vw, 0.9rem);
            color: var(--text-sub); line-height: 1.7;
        }

        /* ===========================
           4. 对比页 (slide-compare)
           =========================== */
        .slide-compare {
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        .compare-container {
            position: relative; z-index: 2; width: 100%; max-width: 1100px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .compare-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            text-align: center; margin-bottom: clamp(16px, 2.5vh, 32px);
        }

        /* 顶部传统纹样装饰 */
        .compare-top-deco {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: clamp(16px, 2vh, 28px); width: 100%;
        }
        .compare-top-deco .deco-line {
            flex: 1; max-width: 200px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .compare-top-deco .deco-diamond {
            width: 8px; height: 8px; background: var(--gold);
            transform: rotate(45deg); opacity: 0.6;
        }

        .compare-columns {
            display: grid; grid-template-columns: 1fr auto 1fr;
            gap: 0; width: 100%; align-items: stretch;
        }

        .compare-col {
            padding: clamp(16px, 2vw, 28px);
            border-radius: 8px;
            display: flex; flex-direction: column; gap: clamp(10px, 1.5vh, 16px);
        }
        .compare-col-left {
            background: rgba(196,30,58,0.04);
            border: 1px solid rgba(196,30,58,0.12);
        }
        .compare-col-right {
            background: rgba(30,58,95,0.04);
            border: 1px solid rgba(30,58,95,0.12);
        }

        .compare-col-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1rem, 1.8vw, 1.3rem);
            text-align: center; padding-bottom: clamp(8px, 1vh, 14px);
            border-bottom: 2px solid var(--gold); margin-bottom: 4px;
        }
        .compare-col-left .compare-col-title { color: var(--primary); }
        .compare-col-right .compare-col-title { color: var(--indigo); }

        .compare-point {
            font-size: clamp(0.82rem, 1.2vw, 0.95rem);
            color: var(--text); line-height: 1.7;
            padding: clamp(6px, 0.8vh, 10px) 0;
            border-bottom: 1px dashed rgba(0,0,0,0.06);
        }
        .compare-point:last-child { border-bottom: none; }

        /* VS 标识 */
        .compare-vs {
            display: flex; align-items: center; justify-content: center;
            padding: 0 clamp(12px, 2vw, 24px);
        }
        .compare-vs-circle {
            width: clamp(40px, 5vw, 56px); height: clamp(40px, 5vw, 56px);
            border-radius: 50%;
            background: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(0.8rem, 1.2vw, 1rem);
            color: var(--gold);
            box-shadow: 0 2px 12px rgba(196,30,58,0.3);
        }

        /* 底部传统纹样装饰 */
        .compare-bottom-deco {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: clamp(16px, 2vh, 28px); width: 100%;
        }
        .compare-bottom-deco .deco-line {
            flex: 1; max-width: 200px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        .compare-bottom-deco .deco-diamond {
            width: 8px; height: 8px; background: var(--primary);
            transform: rotate(45deg); opacity: 0.4;
        }

        /* ===========================
           5. 时间线页 (slide-timeline)
           =========================== */
        .slide-timeline {
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* 淡雅竹简纹理背景 */
        .timeline-bamboo-bg {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 120px,
                    rgba(212,175,55,0.03) 120px,
                    rgba(212,175,55,0.03) 121px
                );
        }

        .timeline-container {
            position: relative; z-index: 2; width: 100%; max-width: 900px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center;
        }

        .timeline-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            text-align: center; margin-bottom: clamp(20px, 3vh, 36px);
        }

        .timeline-list {
            position: relative; padding-left: clamp(30px, 4vw, 50px);
            display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px);
        }

        /* 竖向连接线 - 金色虚线 */
        .timeline-list::before {
            content: '';
            position: absolute; left: clamp(10px, 1.5vw, 18px);
            top: 0; bottom: 0; width: 2px;
            background: repeating-linear-gradient(
                to bottom,
                var(--gold) 0px, var(--gold) 6px,
                transparent 6px, transparent 12px
            );
            opacity: 0.5;
        }

        .timeline-item {
            position: relative;
            display: flex; align-items: flex-start; gap: clamp(12px, 1.5vw, 20px);
        }

        /* 节点 - 红色圆形 + 金色外圈 */
        .timeline-node {
            position: absolute;
            left: calc(-1 * clamp(30px, 4vw, 50px) + clamp(2px, 0.3vw, 5px));
            top: 4px;
            width: clamp(18px, 2.2vw, 24px); height: clamp(18px, 2.2vw, 24px);
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--gold);
            box-shadow: 0 0 8px rgba(212,175,55,0.3);
            z-index: 1;
        }

        .timeline-item-content {
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 6px;
            padding: clamp(12px, 1.5vw, 20px);
            flex: 1;
        }

        .timeline-item-date {
            font-family: var(--font-d); font-weight: 600;
            font-size: clamp(0.8rem, 1.2vw, 0.95rem);
            color: var(--primary); margin-bottom: 4px;
        }

        .timeline-item-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(0.9rem, 1.3vw, 1.05rem);
            color: var(--text); margin-bottom: 4px;
        }

        .timeline-item-desc {
            font-size: clamp(0.78rem, 1.1vw, 0.88rem);
            color: var(--text-sub); line-height: 1.7;
        }

        /* ===========================
           6. 数据展示页 (slide-data)
           =========================== */
        .slide-data {
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        .data-container {
            position: relative; z-index: 2; width: 100%; max-width: 1000px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .data-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            text-align: center; margin-bottom: clamp(16px, 2.5vh, 32px);
        }

        /* 数据卡片 - 带回纹角装饰 */
        .data-card {
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 8px;
            padding: clamp(20px, 2.5vw, 36px);
            width: 100%;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        /* 回纹角装饰 */
        .data-card::before, .data-card::after {
            content: ''; position: absolute;
            width: 16px; height: 16px;
            border-color: var(--gold); border-style: solid;
            opacity: 0.5;
        }
        .data-card::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }
        .data-card::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }
        .data-card .huiwen-corner-tr,
        .data-card .huiwen-corner-bl {
            position: absolute;
            width: 16px; height: 16px;
            border-color: var(--gold); border-style: solid;
            opacity: 0.5;
        }
        .data-card .huiwen-corner-tr {
            top: -1px; right: -1px;
            border-width: 2px 2px 0 0;
        }
        .data-card .huiwen-corner-bl {
            bottom: -1px; left: -1px;
            border-width: 0 0 2px 2px;
        }

        /* 柱形图 */
        .bar-chart {
            display: flex; align-items: flex-end; justify-content: center;
            gap: clamp(12px, 2vw, 28px);
            height: clamp(180px, 25vh, 280px);
            padding: 0 clamp(10px, 1vw, 20px);
            border-bottom: 2px solid rgba(0,0,0,0.08);
        }

        .bar-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; flex: 1; max-width: 80px;
        }

        .bar-value {
            font-family: var(--font-d); font-weight: 600;
            font-size: clamp(0.72rem, 1vw, 0.88rem);
            color: var(--text);
        }

        .bar-fill {
            width: 100%; border-radius: 4px 4px 0 0;
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-height: 4px;
            position: relative;
        }
        .bar-fill.color-red { background: linear-gradient(180deg, var(--primary), #e8304a); }
        .bar-fill.color-gold { background: linear-gradient(180deg, var(--gold), #e8c84a); }
        .bar-fill.color-indigo { background: linear-gradient(180deg, var(--indigo), #2a5a8f); }

        .bar-label {
            font-size: clamp(0.7rem, 1vw, 0.82rem);
            color: var(--text-sub); text-align: center;
            white-space: nowrap;
        }

        /* ===========================
           7. 总结页 (slide-summary)
           =========================== */
        .slide-summary {
            background: linear-gradient(180deg, var(--bg) 0%, rgba(212,175,55,0.06) 100%);
            color: var(--text); overflow: hidden;
        }

        .summary-container {
            position: relative; z-index: 2; width: 100%; max-width: 800px;
            padding: clamp(1.5rem, 3vh, 3rem) clamp(2.5rem, 5vw, 5rem);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .summary-title {
            font-family: var(--font-d); font-weight: 700;
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            text-align: center; margin-bottom: clamp(20px, 3vh, 36px);
        }

        /* 核心结论 */
        .summary-conclusion {
            background: var(--primary);
            color: #ffffff;
            font-family: var(--font-d); font-weight: 600;
            font-size: clamp(1rem, 1.6vw, 1.25rem);
            text-align: center; line-height: 1.6;
            padding: clamp(14px, 2vh, 24px) clamp(20px, 3vw, 40px);
            border-radius: 6px;
            margin-bottom: clamp(20px, 3vh, 36px);
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(196,30,58,0.2);
        }

        /* 要点列表 */
        .summary-points {
            list-style: none; width: 100%;
            display: flex; flex-direction: column; gap: clamp(10px, 1.5vh, 16px);
        }

        .summary-point {
            display: flex; align-items: flex-start; gap: clamp(10px, 1.2vw, 16px);
            font-size: clamp(0.88rem, 1.3vw, 1.02rem);
            color: var(--text); line-height: 1.7;
        }

        /* 金色菱形 */
        .summary-point::before {
            content: '';
            width: 10px; height: 10px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* 底部印章装饰 */
        .summary-seal {
            margin-top: clamp(24px, 4vh, 48px);
            width: clamp(44px, 6vw, 68px); height: clamp(44px, 6vw, 68px);
            border: 3px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            transform: rotate(-6deg);
            font-family: var(--font-d); font-size: clamp(18px, 2.5vw, 30px);
            color: var(--primary); font-weight: 700;
            opacity: 0.5;
        }

        /* ===========================
           响应式设计
           =========================== */
        @media (max-width: 768px) {
            .card-grid-2col { grid-template-columns: 1fr; }

            .compare-columns {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .compare-vs {
                padding: 8px 0;
            }
            .compare-col-left, .compare-col-right {
                background: rgba(196,30,58,0.03);
                border-color: rgba(0,0,0,0.08);
            }

            .cover-cloud { top: 16px; left: 16px; opacity: 0.1; }
            .cover-seal { bottom: 20px; right: 20px; }

            .nav-dots { right: 0.5rem; gap: 8px; }
            .nav-dot { width: 8px; height: 8px; }

            .bar-chart { gap: 8px; }
            .bar-item { max-width: 50px; }

            .corner-huiwen { display: none; }
        }

        /* ===== prefers-reduced-motion ===== */
        @media (prefers-reduced-motion: reduce) {
            .slide, .reveal, .zhongshi-card, .zhongshi-card-sm,
            .toc-item, .nav-dot, .progress-bar, .bar-fill {
                transition: none;
            }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="slides-container" id="slidesContainer">
        {{ slides|safe }}
    </div>
    <div class="nav-dots" id="navDots"></div>
    <div class="page-indicator" id="pageIndicator"></div>

    <script>
    (function() {
        /* ===== 幻灯片导航系统 ===== */
        var slides = document.querySelectorAll('.slide');
        var total = slides.length;
        var current = 0;
        var isAnimating = false;
        var progressBar = document.getElementById('progressBar');
        var navDots = document.getElementById('navDots');
        var pageIndicator = document.getElementById('pageIndicator');

        /* 创建导航点 */
        for (var i = 0; i < total; i++) {
            var dot = document.createElement('button');
            dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 页');
            (function(idx) {
                dot.addEventListener('click', function() { goTo(idx); });
            })(i);
            navDots.appendChild(dot);
        }

        /* 更新幻灯片位置 */
        function updateSlides() {
            slides.forEach(function(slide, idx) {
                slide.style.transform = 'translateY(' + ((idx - current) * 100) + 'vh)';
                if (idx === current) slide.classList.add('active');
                else slide.classList.remove('active');
            });
            progressBar.style.width = (total > 1 ? (current / (total - 1)) * 100 : 100) + '%';
            var dots = navDots.querySelectorAll('.nav-dot');
            dots.forEach(function(d, idx) {
                if (idx === current) d.classList.add('active');
                else d.classList.remove('active');
            });
            pageIndicator.textContent = (current + 1) + ' / ' + total;
        }

        /* 跳转到指定页 */
        function goTo(index) {
            if (isAnimating || index === current || index < 0 || index >= total) return;
            isAnimating = true;
            current = index;
            updateSlides();
            setTimeout(function() { isAnimating = false; }, 650);
        }

        /* 键盘导航 */
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault(); goTo(current + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault(); goTo(current - 1);
            } else if (e.key === 'Home') {
                e.preventDefault(); goTo(0);
            } else if (e.key === 'End') {
                e.preventDefault(); goTo(total - 1);
            }
        });

        /* 滚轮导航 */
        var wheelTimeout = null;
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
            if (wheelTimeout) return;
            wheelTimeout = setTimeout(function() { wheelTimeout = null; }, 800);
            goTo(current + (e.deltaY > 0 ? 1 : -1));
        }, { passive: false });

        /* 触摸导航 */
        var touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        document.addEventListener('touchend', function(e) {
            var diff = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(diff) > 50) goTo(current + (diff > 0 ? 1 : -1));
        }, { passive: true });

        /* 初始化 */
        updateSlides();

        /* ===== 日期填充 ===== */
        document.querySelectorAll('.cover-date').forEach(function(el) {
            var now = new Date();
            el.textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
        });

        /* ===== 柱形图动画 ===== */
        function animateBars() {
            document.querySelectorAll('.slide.active .bar-fill').forEach(function(bar) {
                var target = bar.getAttribute('data-height');
                if (target) {
                    bar.style.height = target;
                }
            });
        }
        /* 监听幻灯片切换时触发柱形图动画 */
        var origGoTo = goTo;
        goTo = function(index) {
            origGoTo(index);
            setTimeout(animateBars, 100);
        };
        /* 初始页也触发 */
        setTimeout(animateBars, 300);

        /* ===== 金色粒子效果 ===== */
        var canvas = document.getElementById('particleCanvas');
        var ctx = canvas.getContext('2d');
        var particles = [];
        var particleCount = 25;
        var animId = null;

        /* 检查是否偏好减少动画 */
        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        /* 粒子类 */
        function Particle() {
            this.reset();
        }
        Particle.prototype.reset = function() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 0.8;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.3 + 0.1;
            this.fadeDir = Math.random() > 0.5 ? 1 : -1;
            this.fadeSpeed = Math.random() * 0.003 + 0.001;
        };
        Particle.prototype.update = function() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.opacity += this.fadeDir * this.fadeSpeed;
            if (this.opacity > 0.4) { this.opacity = 0.4; this.fadeDir = -1; }
            if (this.opacity < 0.05) { this.opacity = 0.05; this.fadeDir = 1; }
            /* 超出边界时重置 */
            if (this.x < -10 || this.x > canvas.width + 10 ||
                this.y < -10 || this.y > canvas.height + 10) {
                this.reset();
            }
        };
        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(212, 175, 55, ' + this.opacity + ')';
            ctx.fill();
        };

        /* 初始化粒子 */
        if (!prefersReducedMotion) {
            for (var p = 0; p < particleCount; p++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                animId = requestAnimationFrame(animateParticles);
            }
            animateParticles();

            /* 页面不可见时暂停动画 */
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (animId) cancelAnimationFrame(animId);
                    animId = null;
                } else {
                    if (!animId) animateParticles();
                }
            });
        }
    })();
    </script>
</body>
</html>
